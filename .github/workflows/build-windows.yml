name: Build Windows portable EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file portable executable
        run: dotnet publish DiagnosticoPC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DiagnosticoPC-Windows-x64
          path: bin/Release/net8.0-windows/win-x64/publish/DiagnosticoPC.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DiagnosticoPC v1.0.${{ github.run_number }}
          body: |
            Ejecutable portable para Windows 11 x64.
            Descargá DiagnosticoPC.exe y ejecutalo. No requiere instalación.
            Aplicación de diagnóstico de solo lectura.
          files: bin/Release/net8.0-windows/win-x64/publish/DiagnosticoPC.exe
          make_latest: true
