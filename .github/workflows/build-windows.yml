name: Build Windows portable EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file portable executable
        run: dotnet publish DiagnosticoPC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DiagnosticoPC-Windows-x64
          path: bin/Release/net8.0-windows/win-x64/publish/DiagnosticoPC.exe
          if-no-files-found: error
          retention-days: 30
